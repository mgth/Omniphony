[package]
name = "omniphony-osc-contract"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The Omniphony OSC control/state address contract, shared by the engine and its clients."

# Address constants and framing remain dependency-free. Clients opt into the
# typed measurement schema explicitly.
[features]
measurement = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
