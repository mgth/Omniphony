[package]
name = "omniphony-studio"
version = "0.4.1"
edition = "2021"

[[bin]]
name = "omniphony-studio"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SOFA database browser (sofacoustics.org): tiny blocking HTTP client, rustls.
ureq = "2"
# Read SOFA global attributes (License, AuthorContact, Organization) for the
# per-file license display required before using downloaded HRTF sets.
sofar = "0.3"
# Native file-open dialog for importing local SOFA files.
tauri-plugin-dialog = "2"
# 0.11+ required: rosc 0.10's UDP decoder fails on OSC blob args (ReadError(Eof)),
# which silently dropped the gain-table chunks. 0.10-encoded blobs (from the
# renderer) decode fine under 0.11.
rosc = "0.11"
flate2 = "1"
socket2 = "0.5"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
# Cross-platform process RSS/virtual memory readout for the opt-in memory
# sampler (debug_memory_stats command). Tiny, no transitive bloat.
memory-stats = "1"

[features]
# Ship WebView DevTools (F12, Inspect, heap snapshots) in RELEASE builds too,
# for memory hunts on Windows where DevTools is otherwise debug-only:
#   cargo build --release --features devtools
devtools = ["tauri/devtools"]

[target.'cfg(windows)'.dependencies]
# Overlapped pipe I/O for the mpv IPC bridge so writes can't park the
# writer thread when mpv's 4 KB IPC reader buffer fills under heavy
# decode load (see mpv_overlay::windows_pipe).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",            # CreateFileW / CreateEventW take SECURITY_ATTRIBUTES
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp", # process-tree enumeration (debug_memory_stats)
    "Win32_System_ProcessStatus",        # K32GetProcessMemoryInfo (WebView2 child RSS)
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# sofar 0.3.0 drops variables from netCDF4-written SOFA files (ASH Toolset
# exports, issue #185). Drop once https://github.com/andreiltd/sofar/pull/29
# ships in a release.
[patch.crates-io]
sofar = { git = "https://github.com/mgth/sofar", rev = "c03ff5cfd997d316ae330e2735e82311769b45a3" }
