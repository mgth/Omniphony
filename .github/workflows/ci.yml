name: CI

# Integration gate for the `main` (integration) and `release` branches.
# Linux validates formatting, tests, native Studio, the web frontend and the
# Tauri host. macOS and Windows compile the renderer and native Studio; Windows
# also checks the shared core on stable. Release archives are built by release.yml.
#
# NOTE on scope: `clippy` is NOT gated yet — the workspace currently has ~70
# clippy warnings plus a couple of deny-level lints, several inside hot audio
# loops where the lint suggestions are not obviously safe. Cleaning that up is a
# separate, careful pass; until then a clippy gate would block merges for
# reasons unrelated to correctness.
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    # Generous because the dependency install depends on GitHub's Ubuntu
    # mirror, which has days where it delivers a 27 MB package at a few
    # hundred kB/s. 45 minutes proved too tight on such a day. This is a
    # backstop against a genuine stall, not a performance target.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v5
        # Caching is an optimization, not a correctness step: a crash of the
        # cache action must never fail the build.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          # Keyed off the lockfile: it names the exact versions the build will
          # use, so the cache turns over when they do and not before.
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('omniphony-renderer/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ci-cargo-

      # Fast fail before the heavy build if formatting drifts.
      - name: Check formatting
        working-directory: omniphony-renderer
        run: cargo fmt --all -- --check

      # ── Platform dependencies ─────────────────────────────────────────────
      # Same PipeWire PPA as release.yml: ubuntu-22.04 ships PipeWire 0.3.48 but
      # pipewire-rs 0.9.x needs >= 0.3.65. The GUI/Tauri libs are kept too so the
      # whole workspace links exactly as in the release build (cheap, robust).
      - name: Install Linux system dependencies
        run: |
          # `apt-get update` reaches Launchpad and can hang rather than fail
          # when it is unwell, so it is bounded: a retry loop is useless
          # against a command that never returns.
          #
          # The install is NOT capped, deliberately. The archive mirror is
          # often merely slow — a 27 MB webkit fetch crawling at a few hundred
          # kB/s is not a stall, and a per-command cap turns a slow run into a
          # failed one (it did: exit 124 mid-download). `timeout-minutes` on
          # the job is the right backstop for a genuine stall; here we only
          # retry, so a dropped download gets another go.
          # The PPA is added by hand, not with add-apt-repository: that tool
          # fetches the archive's signing key through Launchpad's API, which
          # answers 500 (GPGKeyTemporarilyNotFoundError) whenever Launchpad
          # is unwell — as it was on 2026-09-21, for hours. The key is
          # vendored instead (.github/keys/pipewire-upstream-ppa.asc,
          # fingerprint FC43B7352BCC0EC8AF2EEB8B25088A0359807596, the one the
          # API reports for the PPA and the one its InRelease is signed
          # with), so only the archive host itself is needed.
          sudo install -d -m 755 /etc/apt/keyrings
          gpg --dearmor < .github/keys/pipewire-upstream-ppa.asc \
            | sudo tee /etc/apt/keyrings/pipewire-upstream-ppa.gpg > /dev/null
          suite="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/etc/apt/keyrings/pipewire-upstream-ppa.gpg] https://ppa.launchpadcontent.net/pipewire-debian/pipewire-upstream/ubuntu $suite main" \
            | sudo tee /etc/apt/sources.list.d/pipewire-upstream.list > /dev/null
          # `apt-get update` exits 0 when the PPA answers 503 (it only warns
          # and keeps the stock index), and the install then picks Ubuntu's
          # 0.3.48, which libspa refuses ("no field `flags`") long after this
          # step passed. Launchpad does answer 503 intermittently (2026-09-21:
          # two probes in six), so the update is retried until the candidate
          # version actually comes from the PPA.
          pipewire_candidate() {
            apt-cache policy libpipewire-0.3-dev | awk '/Candidate:/ { print $2 }'
          }
          for attempt in 1 2 3 4 5 6 7 8; do
            if sudo timeout 180 apt-get update; then
              candidate="$(pipewire_candidate)"
              if [ -n "$candidate" ] && dpkg --compare-versions "$candidate" ge 0.3.65; then
                echo "PipeWire candidate from the PPA: $candidate"
                break
              fi
              echo "PipeWire candidate is '$candidate' (the PPA index was not fetched); retrying" >&2
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "apt-get update never fetched the PipeWire PPA after $attempt attempts" >&2
              exit 1
            fi
            sleep 20
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libssl-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libpipewire-0.3-dev \
              libxkbcommon-dev \
              libwayland-dev \
              pkg-config; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get install failed after $attempt attempts" >&2
              exit 1
            fi
            sleep 10
          done
          installed="$(dpkg-query -W -f='${Version}' libpipewire-0.3-dev)"
          if ! dpkg --compare-versions "$installed" ge 0.3.65; then
            echo "libpipewire-0.3-dev $installed installed; pipewire-rs 0.9 needs >= 0.3.65" >&2
            exit 1
          fi
          echo "libpipewire-0.3-dev $installed"

      # ── Rust: build + test (strict gate) ──────────────────────────────────
      # Every cargo invocation below passes --locked. Two things follow from it:
      # the versions built are the ones the lockfile names, so a fresh upstream
      # release cannot change what CI compiles (a broken `jiff 0.2.36` did
      # exactly that, on all three platforms, with no commit moving); and a
      # lockfile left stale by a manifest edit fails the build instead of being
      # updated in place and forgotten.
      - name: Build renderer workspace
        working-directory: omniphony-renderer
        run: cargo build --workspace --locked

      - name: Test renderer workspace
        working-directory: omniphony-renderer
        run: cargo test --workspace --locked

      # Compile-only gate for the release-only perf tests. The perf-gate
      # feature is off in the normal test run and its module is compiled out
      # in debug builds, so nothing above ever type-checks it and it can rot
      # silently (it did: E0057, caught on PR #222). Check-only on purpose —
      # the timing test itself must run alone and stays out of the parallel
      # PR gate (see renderer/src/spatial_renderer/perf_gate.rs module doc).
      - name: Check perf-gate feature compiles (release)
        working-directory: omniphony-renderer
        run: cargo check --release -p renderer --features perf-gate --tests --locked

      # The OSC contract is a crate of its own, shared by the engine and the
      # Studio and a member of neither workspace, so `--workspace` above does
      # not reach it. Its tests are the guard that both ends name addresses
      # instead of spelling them — the failure it catches is a typo that
      # compiles, matches nothing and silently disables a control.
      - name: Test the OSC contract
        run: cargo test --locked --manifest-path osc-contract/Cargo.toml

      # ── C ABI smoke test (liborender) ──────────────────────────────────────
      # Compile and run the header/link smoke test against the debug cdylib
      # (debug builds skip the soname so the bare .so links directly). Guards
      # the generated header, the exported symbols, and the version handshake —
      # this is what mpv consumes, so it must never drift silently.
      - name: C ABI smoke test (liborender)
        working-directory: omniphony-renderer
        run: |
          cc -Wall -Werror -I orender_ffi/include orender_ffi/examples/smoke.c \
             -L target/debug -lorender -o target/debug/orender_smoke
          LD_LIBRARY_PATH=target/debug target/debug/orender_smoke

      # ── Native Studio (egui/wgpu) ─────────────────────────────────────────
      # The phase-2 replacement of the web frontend. It is a separate workspace
      # (the egui app and its toolkit-free core, omniphony-studio-core)
      # with its own toolchain pin (egui 0.36 needs a newer rustc than the
      # renderer workspace uses), so it gets its own steps rather than joining
      # the workspace build above. Without them the whole port would have no
      # gate at all: the renderer steps do not compile a line of it.
      #
      # The tests are pure — coordinate round-trips, formatting rules, layout
      # arithmetic — so no display is needed. Nothing here opens a window.
      # The crate's toolchain pin is auto-installed by rustup when cargo runs
      # here, but a pinned toolchain comes without components: rustfmt has to
      # be asked for by name. The version is read from the pin file so the two
      # cannot drift apart.
      # The native Studio's own build tree, cached separately from the
      # renderer's. It is a different toolchain and a disjoint dependency set —
      # egui, wgpu and their graphics stack are nobody else's — and one entry
      # holding both would be evicted by whichever changed last. Its Cargo.lock
      # is tracked, so the key can be exact rather than a guess from manifests.
      - name: Cache the native Studio build
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: omniphony-studio-egui/target
          key: ${{ runner.os }}-studio-egui-${{ hashFiles('omniphony-studio-egui/Cargo.lock', 'omniphony-studio-egui/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-studio-egui-

      - name: Install rustfmt for the native Studio toolchain
        working-directory: omniphony-studio-egui
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install --profile minimal --component rustfmt "$channel"

      - name: Check native Studio formatting
        working-directory: omniphony-studio-egui
        run: cargo fmt --all --check

      - name: Build native Studio
        working-directory: omniphony-studio-egui
        run: cargo build --workspace --locked

      # The core must stay drawable by any UI toolkit (ARCHITECTURE.md): no
      # egui, eframe, wgpu, winit, accesskit or rfd anywhere in its dependency
      # graph. The compiler already stops it importing the app; this stops a UI
      # crate from being added to its manifest.
      - name: Check the native Studio core has no UI dependency
        working-directory: omniphony-studio-egui
        run: |
          tree=$(cargo tree -p omniphony-studio-core -e normal --prefix none --format '{p}' --locked)
          ui=$(printf '%s\n' "$tree" \
            | grep -E '^(egui|eframe|egui-wgpu|egui_wgpu|epaint|emath|ecolor|wgpu|wgpu-[a-z]+|winit|rfd|accesskit[a-z_-]*) ' \
            | sort -u || true)
          if [ -n "$ui" ]; then
            echo "::error::omniphony-studio-core depends on UI crates (see omniphony-studio-egui/ARCHITECTURE.md):"
            echo "$ui"
            exit 1
          fi

      # The scene is the other half a migration carries over. wgpu is allowed
      # here and nowhere else — it is the renderer, not a toolkit — but a
      # toolkit in this graph would mean the 3D engine had been tied to one
      # again, which is what phase 4 undid.
      - name: Check the native Studio scene has no toolkit dependency
        working-directory: omniphony-studio-egui
        run: |
          tree=$(cargo tree -p omniphony-studio-scene -e normal --prefix none --format '{p}' --locked)
          ui=$(printf '%s\n' "$tree" \
            | grep -E '^(egui|eframe|egui-wgpu|egui_wgpu|epaint|emath|ecolor|winit|rfd|accesskit[a-z_-]*) ' \
            | sort -u || true)
          if [ -n "$ui" ]; then
            echo "::error::omniphony-studio-scene depends on a UI toolkit (see omniphony-studio-egui/ARCHITECTURE.md):"
            echo "$ui"
            exit 1
          fi

      # Includes the architecture ratchet (tests/architecture.rs), which keeps
      # protocol, model writes, I/O and timers out of the UI crate.
      - name: Test native Studio
        working-directory: omniphony-studio-egui
        run: cargo test --workspace --locked

      # ── Studio frontend build (no Tauri bundling / no sidecar) ─────────────
      - name: Install Studio npm dependencies
        working-directory: omniphony-studio
        run: npm ci

      - name: Build Studio frontend
        working-directory: omniphony-studio
        run: npm run build

      # This host has a separate build tree from both the renderer and native
      # Studio. Cache it too so core changes do not rebuild GTK/WebKit every PR.
      - name: Cache the Tauri host build
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: omniphony-studio/src-tauri/target
          key: ${{ runner.os }}-studio-tauri-${{ hashFiles('omniphony-studio/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-studio-tauri-

      # Type-check the web host as a consumer of the shared native core. No
      # sidecar/resource bundle is needed for this compatibility gate.
      - name: Check Tauri host against the shared core
        working-directory: omniphony-studio/src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":null}}'
        run: cargo check --locked

      # Drift pins for the renderer<->Studio mirrors (channel-spelling
      # normalisation, geometry golden vectors) — hard gates, like knip below.
      - name: Channel-alias parity tests
        working-directory: omniphony-studio
        run: npm run test:labels

      - name: Math golden-vector tests
        working-directory: omniphony-studio
        run: npm run test:math

      # Translation parity is reported but never blocks a merge: incomplete
      # locales fall back to English at runtime, so this is a heads-up, not a
      # gate. Emits ::warning:: annotations on the PR.
      - name: Check i18n parity (warn-only)
        working-directory: omniphony-studio
        continue-on-error: true
        run: npm run i18n:check

      # Dead-code gate (knip): a module with no importer fails the build.
      # An orphaned ingestion module is how live-option state silently stopped
      # reaching the UI for months (see docs/live-options-registry.md, "The
      # incident"); unused *exports* are only warnings for now.
      - name: Dead-code lint (knip)
        working-directory: omniphony-studio
        run: npm run lint:dead

      # Options-schema contract: the renderer dumps its declared live options
      # (registry rows); every option must resolve its Studio i18n keys. Hard
      # gate — an option declared engine-side but invisible to the UI is the
      # silent-omission class the registry exists to kill.
      - name: Check options-schema ↔ Studio contract
        run: |
          cargo run -q -p renderer --example dump_options_schema --locked \
            --manifest-path omniphony-renderer/Cargo.toml > /tmp/options-schema.json
          node omniphony-studio/scripts/check-options-schema.mjs /tmp/options-schema.json

  build-macos:
    # macOS arm64 compile gate. The renderer workspace pulls the CoreAudio
    # output backend (cpal) and the `sys` signal/IO layer, both of which carry
    # macOS-specific code paths. Build-only (no PipeWire/Tauri) — this catches
    # macOS portability regressions on PRs, before the tag-triggered release
    # builds (liborender / Studio / mpv) ever run on macOS.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          key: macos-ci-cargo-${{ hashFiles('omniphony-renderer/Cargo.lock') }}
          restore-keys: macos-ci-cargo-

      - name: Build renderer workspace (macOS arm64)
        working-directory: omniphony-renderer
        run: cargo build --workspace --locked

      # The native Studio ships on macOS too (release.yml attaches an archive
      # per platform). Until this step existed only the Linux job compiled it,
      # so a platform-specific break — wgpu's Metal path, winit, the file
      # dialogs — surfaced at release time. Same toolchain pin and build tree
      # as the Linux job.
      - name: Cache the native Studio build
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: omniphony-studio-egui/target
          key: macos-studio-egui-${{ hashFiles('omniphony-studio-egui/Cargo.lock', 'omniphony-studio-egui/rust-toolchain.toml') }}
          restore-keys: macos-studio-egui-

      - name: Build native Studio (macOS arm64)
        working-directory: omniphony-studio-egui
        run: cargo build --workspace --locked

  build-windows:
    # Windows x64 compile gate. On Windows cpal always pulls its ASIO backend
    # (audio_output enables the feature per-target; the workspace `asio` feature
    # is a legacy no-op alias), so this is the only job that exercises asio-sys:
    # fetching the SDK, running bindgen over asio.h, compiling the SDK's C++ into
    # libasio.a, and linking it. Until this job existed, that whole path was only
    # ever built by the tag-triggered release.yml — a broken SDK setup surfaced at
    # release time, not on the PR that caused it.
    #
    # Build-only: no Tauri bundle, and no vcpkg/SAF since saf_vbap is opt-in and
    # the default VBAP backend is pure Rust. bindgen finds libclang on the runner
    # image without any setup, which is why no LLVM step appears here.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          key: windows-ci-cargo-${{ hashFiles('omniphony-renderer/Cargo.lock') }}
          restore-keys: windows-ci-cargo-

      - name: Setup ASIO SDK
        uses: ./.github/actions/setup-asio-sdk

      - name: Build renderer workspace (Windows x64)
        working-directory: omniphony-renderer
        run: cargo build --workspace --locked

      # The native Studio's core, which the Tauri host depends on. Its Windows
      # path — the process-tree working-set readout — had never been compiled
      # for Windows by anything: the Linux job builds the whole egui workspace,
      # this job built only the renderer, and the Tauri host carried its own
      # copy of the module. It did not compile, and nothing said so.
      #
      # Run from the repository root on purpose. `omniphony-studio-egui` pins a
      # toolchain for egui's sake; the core does not need it, and the Tauri host
      # builds it on stable, which is what this checks.
      - name: Build the native Studio core (Windows x64)
        run: cargo build --locked --manifest-path omniphony-studio-egui/core/Cargo.toml

      # The whole native Studio, on its pinned toolchain this time: it ships
      # on Windows (release.yml attaches an archive per platform), and the
      # step above only proves the core. Run from inside the directory so the
      # pin applies.
      - name: Cache the native Studio build
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: omniphony-studio-egui/target
          key: windows-studio-egui-${{ hashFiles('omniphony-studio-egui/Cargo.lock', 'omniphony-studio-egui/rust-toolchain.toml') }}
          restore-keys: windows-studio-egui-

      - name: Build native Studio (Windows x64)
        working-directory: omniphony-studio-egui
        run: cargo build --workspace --locked
