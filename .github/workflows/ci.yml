name: CI

# Integration gate for the `main` (integration) and `release` branches.
# Linux validates formatting, tests, native Studio, the web frontend and the
# Tauri host. macOS and Windows compile the renderer and native Studio; macOS
# also runs the large-datagram socket tests, Windows also checks the shared
# core on stable. Release archives are built by release.yml.
#
# The `lint` job ratchets clippy (counts per crate and lint can only go down,
# omniphony-renderer/scripts/clippy-ratchet.sh), runs cargo-deny and checks
# that every action is pinned by commit; `msrv` builds the renderer on its
# declared minimum Rust.
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    # Generous because the dependency install depends on GitHub's Ubuntu
    # mirror, which has days where it delivers a 27 MB package at a few
    # hundred kB/s. 45 minutes proved too tight on such a day. This is a
    # backstop against a genuine stall, not a performance target.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        # Caching is an optimization, not a correctness step: a crash of the
        # cache action must never fail the build.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          # Keyed off the lockfile: it names the exact versions the build will
          # use, so the cache turns over when they do and not before.
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('omniphony-renderer/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ci-cargo-

      # Fast fail before the heavy build if formatting drifts.
      - name: Check formatting
        working-directory: omniphony-renderer
        run: cargo fmt --all -- --check

      # ── Platform dependencies ─────────────────────────────────────────────
      # Same PipeWire PPA as release.yml: ubuntu-22.04 ships PipeWire 0.3.48 but
      # pipewire-rs 0.9.x needs >= 0.3.65. The GUI/Tauri libs are kept too so the
      # whole workspace links exactly as in the release build (cheap, robust).
      - name: Install Linux system dependencies
        run: |
          # `apt-get update` reaches Launchpad and can hang rather than fail
          # when it is unwell, so it is bounded: a retry loop is useless
          # against a command that never returns.
          #
          # The install is NOT capped, deliberately. The archive mirror is
          # often merely slow — a 27 MB webkit fetch crawling at a few hundred
          # kB/s is not a stall, and a per-command cap turns a slow run into a
          # failed one (it did: exit 124 mid-download). `timeout-minutes` on
          # the job is the right backstop for a genuine stall; here we only
          # retry, so a dropped download gets another go.
          # The PPA is added by hand, not with add-apt-repository: that tool
          # fetches the archive's signing key through Launchpad's API, which
          # answers 500 (GPGKeyTemporarilyNotFoundError) whenever Launchpad
          # is unwell — as it was on 2026-09-21, for hours. The key is
          # vendored instead (.github/keys/pipewire-upstream-ppa.asc,
          # fingerprint FC43B7352BCC0EC8AF2EEB8B25088A0359807596, the one the
          # API reports for the PPA and the one its InRelease is signed
          # with), so only the archive host itself is needed.
          sudo install -d -m 755 /etc/apt/keyrings
          gpg --dearmor < .github/keys/pipewire-upstream-ppa.asc \
            | sudo tee /etc/apt/keyrings/pipewire-upstream-ppa.gpg > /dev/null
          suite="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/etc/apt/keyrings/pipewire-upstream-ppa.gpg] https://ppa.launchpadcontent.net/pipewire-debian/pipewire-upstream/ubuntu $suite main" \
            | sudo tee /etc/apt/sources.list.d/pipewire-upstream.list > /dev/null
          # `apt-get update` exits 0 when the PPA answers 503 (it only warns
          # and keeps the stock index), and the install then picks Ubuntu's
          # 0.3.48, which libspa refuses ("no field `flags`") long after this
          # step passed. Launchpad does answer 503 intermittently (2026-09-21:
          # two probes in six), so the update is retried until the candidate
          # version actually comes from the PPA.
          pipewire_candidate() {
            apt-cache policy libpipewire-0.3-dev | awk '/Candidate:/ { print $2 }'
          }
          for attempt in 1 2 3 4 5 6 7 8; do
            if sudo timeout 180 apt-get update; then
              candidate="$(pipewire_candidate)"
              if [ -n "$candidate" ] && dpkg --compare-versions "$candidate" ge 0.3.65; then
                echo "PipeWire candidate from the PPA: $candidate"
                break
              fi
              echo "PipeWire candidate is '$candidate' (the PPA index was not fetched); retrying" >&2
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "apt-get update never fetched the PipeWire PPA after $attempt attempts" >&2
              exit 1
            fi
            sleep 20
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libssl-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libpipewire-0.3-dev \
              libxkbcommon-dev \
              libwayland-dev \
              pkg-config; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get install failed after $attempt attempts" >&2
              exit 1
            fi
            sleep 10
          done
          installed="$(dpkg-query -W -f='${Version}' libpipewire-0.3-dev)"
          if ! dpkg --compare-versions "$installed" ge 0.3.65; then
            echo "libpipewire-0.3-dev $installed installed; pipewire-rs 0.9 needs >= 0.3.65" >&2
            exit 1
          fi
          echo "libpipewire-0.3-dev $installed"

      # ── Rust: build + test (strict gate) ──────────────────────────────────
      # Every cargo invocation below passes --locked. Two things follow from it:
      # the versions built are the ones the lockfile names, so a fresh upstream
      # release cannot change what CI compiles (a broken `jiff 0.2.36` did
      # exactly that, on all three platforms, with no commit moving); and a
      # lockfile left stale by a manifest edit fails the build instead of being
      # updated in place and forgotten.
      - name: Build renderer workspace
        working-directory: omniphony-renderer
        run: cargo build --workspace --locked

      - name: Test renderer workspace
        working-directory: omniphony-renderer
        run: cargo test --workspace --locked

      # The bridge ABI policy (BRIDGE_API.md, "Versioning") held against a
      # real old plugin: the reference bridge built at the last release tag
      # is loaded into this host, which must load it when both share a
      # bridge_api minor and otherwise refuse it with an error naming both
      # versions. The layout itself is pinned by bridge_api's abi_baseline
      # test in the run above. The old bridge gets a target directory of its
      # own so its library does not replace the current one.
      - name: Load the previous release's bridge
        run: |
          tag="$(git ls-remote --tags --refs origin 'v*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)"
          echo "Last release: $tag"
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          git worktree add --detach "$RUNNER_TEMP/previous-release" "$tag"
          target="$GITHUB_WORKSPACE/omniphony-renderer/target/previous-release"
          (cd "$RUNNER_TEMP/previous-release/omniphony-renderer" \
            && CARGO_TARGET_DIR="$target" cargo build --locked -p reference_bridge)
          cd omniphony-renderer
          ORENDER_PREVIOUS_RELEASE_BRIDGE="$target/debug/libreference_bridge.so" \
            cargo test --locked -p orender_engine --test previous_release_bridge -- --ignored --nocapture

      # The bit-identity tests, optimised. The renderer's hot loops have
      # CPU-specific builds picked at run time (AVX2 today, wider where a CPU
      # has it), each pinned to return the portable build's bits; the
      # speaker-major mix and the cached table reads are pinned the same way
      # against their reference. The test run above is a debug build, where
      # none of this is vectorised, so the comparison that matters — the code
      # the release ships — would otherwise only ever be run by hand.
      # Filtered to those tests (`bit_for_bit` / `bit_identical` in their
      # names; they run in well under a second) and to the library, so the
      # cost is one optimised build of the renderer and its dependencies.
      #
      # What the comparison exercises depends on the runner's CPU: a test whose
      # wider build this CPU lacks prints that it skipped the comparison and
      # passes. `--nocapture` keeps that line in the log, and the CPU's vector
      # extensions are listed first, so the log says what was compared.
      - name: Test SIMD builds against the portable ones (release)
        working-directory: omniphony-renderer
        run: |
          echo "Runner CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          echo "Vector extensions: $(grep -m1 '^flags' /proc/cpuinfo | grep -o 'avx[^ ]*' | sort -u | tr '\n' ' ')"
          cargo test --release -p renderer --lib --locked -- bit_for_bit bit_identical --nocapture

      # The worst-case block-time gate (renderer/src/spatial_renderer/
      # perf_gate.rs): a high percentile of per-block render time, budgeted as
      # a fraction of the block period rather than in microseconds, so a slow
      # runner does not fail it. Steady and all-moving measured 2-5 % of real
      # time on these runners against a 25 % budget. Release only, behind the
      # perf-gate feature and on one test thread: a timing measurement must
      # not share the machine with the rest of the suite, and in this step it
      # does not. Placed after the step above, which already built the
      # dependencies in release; the feature only rebuilds the renderer crate.
      - name: Run the perf gate (release)
        working-directory: omniphony-renderer
        run: cargo test --release -p renderer --features perf-gate --lib --locked -- spatial_renderer::perf_gate::block_time_steady spatial_renderer::perf_gate::block_time_all_objects_moving --test-threads=1 --nocapture

      # The topology-change cases of the same gate, measured but not gating
      # yet. They time the render thread while the band worker builds, and on
      # a 4-vCPU runner the render thread still loses whole scheduler slices
      # (~3.1 ms) to the build: same commit, same CPU model, one run inside
      # budget and the next at 109 %. That is a real finding about few-core
      # machines, not runner noise, and the fix is a decision about the
      # priority of background threads. Until it lands the step reports
      # (`continue-on-error`) instead of blocking every PR on the scheduler.
      - name: Measure block time across topology changes (release, not gating)
        working-directory: omniphony-renderer
        continue-on-error: true
        run: cargo test --release -p renderer --features perf-gate --lib --locked -- spatial_renderer::perf_gate::block_time_across --test-threads=1 --nocapture

      # The OSC contract is a crate of its own, shared by the engine and the
      # Studio and a member of neither workspace, so `--workspace` above does
      # not reach it. Its tests are the guard that both ends name addresses
      # instead of spelling them — the failure it catches is a typo that
      # compiles, matches nothing and silently disables a control.
      - name: Test the OSC contract
        run: cargo test --locked --manifest-path osc-contract/Cargo.toml

      # ── C ABI smoke test (liborender) ──────────────────────────────────────
      # Compile and run the header/link smoke test against the debug cdylib
      # (debug builds skip the soname so the bare .so links directly). Guards
      # the generated header, the exported symbols, and the version handshake —
      # this is what mpv consumes, so it must never drift silently.
      - name: C ABI smoke test (liborender)
        working-directory: omniphony-renderer
        run: |
          cc -Wall -Werror -I orender_ffi/include orender_ffi/examples/smoke.c \
             -L target/debug -lorender -o target/debug/orender_smoke
          LD_LIBRARY_PATH=target/debug target/debug/orender_smoke

      # orender_ffi's build.rs regenerates include/orender.h with cbindgen on
      # every build (and fails the build in CI if it cannot), so after the
      # builds above the checked-out header is what this commit's source
      # generates. Any difference is a header that was not regenerated and
      # committed with its source change — the file mpv compiles against.
      - name: Check the committed C header is up to date
        run: |
          if ! git diff --exit-code -- omniphony-renderer/orender_ffi/include/orender.h; then
            echo "orender_ffi/include/orender.h is stale: run 'cargo build -p orender_ffi' in omniphony-renderer and commit the regenerated header." >&2
            exit 1
          fi

      # The header is consumed from C (mpv, C11) and must stay usable from C++:
      # compile it standalone as strict ISO C and C++, warnings as errors.
      - name: Check the C header compiles as strict C and C++
        working-directory: omniphony-renderer/orender_ffi/include
        run: |
          printf '#include "orender.h"\nint main(void) { return 0; }\n' > "$RUNNER_TEMP/orender_h.c"
          cp "$RUNNER_TEMP/orender_h.c" "$RUNNER_TEMP/orender_h.cpp"
          gcc -std=c11 -Wall -Wextra -pedantic -Werror -fsyntax-only -I. "$RUNNER_TEMP/orender_h.c"
          g++ -std=c++17 -Wall -Wextra -pedantic -Werror -fsyntax-only -I. "$RUNNER_TEMP/orender_h.cpp"

      # ── Native Studio (egui/wgpu) ─────────────────────────────────────────
      # The phase-2 replacement of the web frontend. It is a separate workspace
      # (the egui app and its toolkit-free core, omniphony-studio-core)
      # with its own toolchain pin (egui 0.36 needs a newer rustc than the
      # renderer workspace uses), so it gets its own steps rather than joining
      # the workspace build above. Without them the whole port would have no
      # gate at all: the renderer steps do not compile a line of it.
      #
      # The tests are pure — coordinate round-trips, formatting rules, layout
      # arithmetic — so no display is needed. Nothing here opens a window.
      # The crate's toolchain pin is auto-installed by rustup when cargo runs
      # here, but a pinned toolchain comes without components: rustfmt has to
      # be asked for by name. The version is read from the pin file so the two
      # cannot drift apart.
      # The native Studio's own build tree, cached separately from the
      # renderer's. It is a different toolchain and a disjoint dependency set —
      # egui, wgpu and their graphics stack are nobody else's — and one entry
      # holding both would be evicted by whichever changed last. Its Cargo.lock
      # is tracked, so the key can be exact rather than a guess from manifests.
      - name: Cache the native Studio build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: omniphony-studio-egui/target
          key: ${{ runner.os }}-studio-egui-${{ hashFiles('omniphony-studio-egui/Cargo.lock', 'omniphony-studio-egui/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-studio-egui-

      - name: Install rustfmt for the native Studio toolchain
        working-directory: omniphony-studio-egui
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install --profile minimal --component rustfmt "$channel"

      - name: Check native Studio formatting
        working-directory: omniphony-studio-egui
        run: cargo fmt --all --check

      - name: Build native Studio
        working-directory: omniphony-studio-egui
        run: cargo build --workspace --locked

      # The core must stay drawable by any UI toolkit (ARCHITECTURE.md): no
      # egui, eframe, wgpu, winit, accesskit or rfd anywhere in its dependency
      # graph. The compiler already stops it importing the app; this stops a UI
      # crate from being added to its manifest.
      - name: Check the native Studio core has no UI dependency
        working-directory: omniphony-studio-egui
        run: |
          tree=$(cargo tree -p omniphony-studio-core -e normal --prefix none --format '{p}' --locked)
          ui=$(printf '%s\n' "$tree" \
            | grep -E '^(egui|eframe|egui-wgpu|egui_wgpu|epaint|emath|ecolor|wgpu|wgpu-[a-z]+|winit|rfd|accesskit[a-z_-]*) ' \
            | sort -u || true)
          if [ -n "$ui" ]; then
            echo "::error::omniphony-studio-core depends on UI crates (see omniphony-studio-egui/ARCHITECTURE.md):"
            echo "$ui"
            exit 1
          fi

      # The scene is the other half a migration carries over. wgpu is allowed
      # here and nowhere else — it is the renderer, not a toolkit — but a
      # toolkit in this graph would mean the 3D engine had been tied to one
      # again, which is what phase 4 undid.
      - name: Check the native Studio scene has no toolkit dependency
        working-directory: omniphony-studio-egui
        run: |
          tree=$(cargo tree -p omniphony-studio-scene -e normal --prefix none --format '{p}' --locked)
          ui=$(printf '%s\n' "$tree" \
            | grep -E '^(egui|eframe|egui-wgpu|egui_wgpu|epaint|emath|ecolor|winit|rfd|accesskit[a-z_-]*) ' \
            | sort -u || true)
          if [ -n "$ui" ]; then
            echo "::error::omniphony-studio-scene depends on a UI toolkit (see omniphony-studio-egui/ARCHITECTURE.md):"
            echo "$ui"
            exit 1
          fi

      # Includes the architecture ratchet (tests/architecture.rs), which keeps
      # protocol, model writes, I/O and timers out of the UI crate.
      - name: Test native Studio
        working-directory: omniphony-studio-egui
        run: cargo test --workspace --locked

      # ── Studio frontend build (no Tauri bundling / no sidecar) ─────────────
      - name: Install Studio npm dependencies
        working-directory: omniphony-studio
        run: npm ci

      - name: Build Studio frontend
        working-directory: omniphony-studio
        run: npm run build

      # This host has a separate build tree from both the renderer and native
      # Studio. Cache it too so core changes do not rebuild GTK/WebKit every PR.
      - name: Cache the Tauri host build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: omniphony-studio/src-tauri/target
          key: ${{ runner.os }}-studio-tauri-${{ hashFiles('omniphony-studio/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-studio-tauri-

      # Type-check the web host as a consumer of the shared native core. No
      # sidecar/resource bundle is needed for this compatibility gate.
      - name: Check Tauri host against the shared core
        working-directory: omniphony-studio/src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":null}}'
        run: cargo check --locked

      # Drift pins for the renderer<->Studio mirrors (channel-spelling
      # normalisation, geometry golden vectors) — hard gates, like knip below.
      - name: Channel-alias parity tests
        working-directory: omniphony-studio
        run: npm run test:labels

      - name: Math golden-vector tests
        working-directory: omniphony-studio
        run: npm run test:math

      # Translation parity is reported but never blocks a merge: incomplete
      # locales fall back to English at runtime, so this is a heads-up, not a
      # gate. Emits ::warning:: annotations on the PR.
      - name: Check i18n parity (warn-only)
        working-directory: omniphony-studio
        continue-on-error: true
        run: npm run i18n:check

      # Dead-code gate (knip): a module with no importer fails the build.
      # An orphaned ingestion module is how live-option state silently stopped
      # reaching the UI for months (see docs/live-options-registry.md, "The
      # incident"); unused *exports* are only warnings for now.
      - name: Dead-code lint (knip)
        working-directory: omniphony-studio
        run: npm run lint:dead

      # Options-schema contract: the renderer dumps its declared live options
      # (registry rows); every option must resolve its Studio i18n keys. Hard
      # gate — an option declared engine-side but invisible to the UI is the
      # silent-omission class the registry exists to kill.
      - name: Check options-schema ↔ Studio contract
        run: |
          cargo run -q -p renderer --example dump_options_schema --locked \
            --manifest-path omniphony-renderer/Cargo.toml > /tmp/options-schema.json
          node omniphony-studio/scripts/check-options-schema.mjs /tmp/options-schema.json
          cargo run -q -p host_audio --example dump_host_options_schema --locked \
            --manifest-path omniphony-renderer/Cargo.toml > /tmp/host-options-schema.json
          node omniphony-studio/scripts/check-options-schema.mjs /tmp/host-options-schema.json

  build-macos:
    # macOS arm64 compile gate. The renderer workspace pulls the CoreAudio
    # output backend (cpal) and the `sys` signal/IO layer, both of which carry
    # macOS-specific code paths. Build-only (no PipeWire/Tauri) but for the
    # socket tests at the end — this catches macOS portability regressions on
    # PRs, before the tag-triggered release builds (liborender / Studio / mpv)
    # ever run on macOS.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          key: macos-ci-cargo-${{ hashFiles('omniphony-renderer/Cargo.lock') }}
          restore-keys: macos-ci-cargo-

      - name: Build renderer workspace (macOS arm64)
        working-directory: omniphony-renderer
        run: cargo build --workspace --locked

      # The native Studio ships on macOS too (release.yml attaches an archive
      # per platform). Until this step existed only the Linux job compiled it,
      # so a platform-specific break — wgpu's Metal path, winit, the file
      # dialogs — surfaced at release time. Same toolchain pin and build tree
      # as the Linux job.
      - name: Cache the native Studio build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: omniphony-studio-egui/target
          key: macos-studio-egui-${{ hashFiles('omniphony-studio-egui/Cargo.lock', 'omniphony-studio-egui/rust-toolchain.toml') }}
          restore-keys: macos-studio-egui-

      - name: Build native Studio (macOS arm64)
        working-directory: omniphony-studio-egui
        run: cargo build --workspace --locked

      # The one thing this job runs rather than compiles. macOS refuses a UDP
      # send larger than the socket's send buffer (EMSGSIZE), and that buffer
      # starts at net.inet.udp.maxdgram: 9,216 bytes, far under a state bundle
      # or a backend script. Linux and Windows have no such limit, so the
      # Linux test run passes whether or not the sockets lift it, and a socket
      # that stops doing so would only be noticed by a macOS user whose saves
      # vanish. Filtered to the tests that send a large datagram or check the
      # buffer (`maximum_size` / `send_buffer` / `deeply_nested` in their
      # names); the sysctl values are printed so the log says what they ran
      # against.
      - name: Test large OSC datagrams from the engine (macOS arm64)
        working-directory: omniphony-renderer
        run: |
          sysctl net.inet.udp.maxdgram net.inet.udp.recvspace
          cargo test -p orender_engine --lib --locked -- maximum_size send_buffer deeply_nested

      - name: Test large OSC datagrams from the native Studio (macOS arm64)
        working-directory: omniphony-studio-egui
        run: cargo test -p omniphony-studio-core --lib --locked -- maximum_size send_buffer

  build-windows:
    # Windows x64 compile gate. On Windows cpal always pulls its ASIO backend
    # (audio_output enables the feature per-target; the workspace `asio` feature
    # is a legacy no-op alias), so this is the only job that exercises asio-sys:
    # fetching the SDK, running bindgen over asio.h, compiling the SDK's C++ into
    # libasio.a, and linking it. Until this job existed, that whole path was only
    # ever built by the tag-triggered release.yml — a broken SDK setup surfaced at
    # release time, not on the PR that caused it.
    #
    # Build-only: no Tauri bundle, and no vcpkg/SAF since saf_vbap is opt-in and
    # the default VBAP backend is pure Rust. bindgen finds libclang on the runner
    # image without any setup, which is why no LLVM step appears here.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Cache Cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          key: windows-ci-cargo-${{ hashFiles('omniphony-renderer/Cargo.lock') }}
          restore-keys: windows-ci-cargo-

      - name: Setup ASIO SDK
        uses: ./.github/actions/setup-asio-sdk

      - name: Build renderer workspace (Windows x64)
        working-directory: omniphony-renderer
        run: cargo build --workspace --locked

      # The native Studio's core, which the Tauri host depends on. Its Windows
      # path — the process-tree working-set readout — had never been compiled
      # for Windows by anything: the Linux job builds the whole egui workspace,
      # this job built only the renderer, and the Tauri host carried its own
      # copy of the module. It did not compile, and nothing said so.
      #
      # Run from the repository root on purpose. `omniphony-studio-egui` pins a
      # toolchain for egui's sake; the core does not need it, and the Tauri host
      # builds it on stable, which is what this checks.
      - name: Build the native Studio core (Windows x64)
        run: cargo build --locked --manifest-path omniphony-studio-egui/core/Cargo.toml

      # The whole native Studio, on its pinned toolchain this time: it ships
      # on Windows (release.yml attaches an archive per platform), and the
      # step above only proves the core. Run from inside the directory so the
      # pin applies.
      - name: Cache the native Studio build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: omniphony-studio-egui/target
          key: windows-studio-egui-${{ hashFiles('omniphony-studio-egui/Cargo.lock', 'omniphony-studio-egui/rust-toolchain.toml') }}
          restore-keys: windows-studio-egui-

      - name: Build native Studio (Windows x64)
        working-directory: omniphony-studio-egui
        run: cargo build --workspace --locked

  lint:
    # Static gates that need no test run: action pinning, cargo-deny and the
    # clippy ratchet for the renderer workspace.
    #
    # Ubuntu 24.04 rather than build-and-test's 22.04: clippy compiles the
    # PipeWire -sys build scripts, and 24.04's stock PipeWire (1.0) already
    # satisfies pipewire-rs 0.9, so this job needs no PPA.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A tag can be moved by whoever controls the action's repository, and
      # the release jobs run actions with `contents: write`; a commit cannot
      # be moved. Every `uses:` therefore names a full commit SHA, with the
      # version it was taken from in a trailing comment. Local actions
      # (`./...`) are part of this repository and exempt.
      - name: Check every action is pinned by commit
        run: |
          unpinned="$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows .github/actions \
            | grep -vE 'uses:[[:space:]]*\./' \
            | grep -vE 'uses:[[:space:]]*[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Actions must be pinned by full commit SHA (with the version as a trailing comment):"
            echo "$unpinned"
            exit 1
          fi

      # The release binary, pinned by version and checksum, rather than the
      # cargo-deny action: its image carries its own, older Rust, and the
      # graph is resolved with whichever cargo runs it.
      - name: Install cargo-deny
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          archive="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$archive.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/$archive/cargo-deny" "$HOME/.cargo/bin/cargo-deny"

      # Advisories, banned or duplicated crates, licences and sources, against
      # omniphony-renderer/deny.toml. `--workspace` makes every member a root:
      # without it only the root package (`orender`) is, and liborender's
      # graph is never looked at. Before clippy because it compiles nothing.
      # A new RustSec advisory fails this without any commit moving: fix it by
      # updating the crate, or ignore the advisory in deny.toml with a reason.
      - name: cargo-deny
        working-directory: omniphony-renderer
        run: cargo deny --workspace --locked check

      - name: Cache Cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          key: ${{ runner.os }}-lint-cargo-${{ hashFiles('omniphony-renderer/Cargo.lock', 'omniphony-renderer/clippy-baseline.txt') }}
          restore-keys: ${{ runner.os }}-lint-cargo-

      # PipeWire for the output and input backends; libclang for the bindgen
      # run in pipewire-sys and libspa-sys. Bounded and retried for the same
      # reasons as build-and-test's install.
      - name: Install Linux system dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get update \
              && sudo apt-get install -y libpipewire-0.3-dev libclang-dev clang pkg-config; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get failed after $attempt attempts" >&2
              exit 1
            fi
            sleep 10
          done

      # Warnings per crate and lint may only go down: a crate absent from
      # omniphony-renderer/clippy-baseline.txt is held at zero, any other
      # count above its baseline fails, and a count below it fails until the
      # lowered baseline is committed. The baseline names the clippy toolchain
      # it was taken with, and the script installs and runs that one, so a
      # new Rust release cannot add warnings to main. Deny-level lints fail
      # clippy itself.
      - name: Clippy ratchet
        run: omniphony-renderer/scripts/clippy-ratchet.sh

  msrv:
    # The renderer workspace on the minimum Rust it declares
    # (`rust-version` in omniphony-renderer/Cargo.toml, read from there so the
    # two cannot drift). Every other job builds on the latest stable, so a
    # newer language feature or std API, or a dependency raising its own
    # floor, would otherwise leave the declared version false. A check, not a
    # build: what an MSRV breaks is name resolution and type checking.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Cache Cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('omniphony-renderer/Cargo.lock', 'omniphony-renderer/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-msrv-cargo-

      # As in the lint job: stock PipeWire on 24.04, no PPA.
      - name: Install Linux system dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get update \
              && sudo apt-get install -y libpipewire-0.3-dev libclang-dev clang pkg-config; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get failed after $attempt attempts" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Check the renderer workspace on its MSRV
        working-directory: omniphony-renderer
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error::no workspace rust-version in omniphony-renderer/Cargo.toml"
            exit 1
          fi
          echo "Declared MSRV: $msrv"
          rustup toolchain install --profile minimal "$msrv"
          cargo "+$msrv" check --workspace --all-targets --locked
