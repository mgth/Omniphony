name: Integration Build

# Rolling pre-release test build for testers, built from `main` (integration).
# Manual on demand + once daily; the daily run is skipped when `main` hasn't
# moved since the last publish (see the `check` job), so the release date stays
# meaningful and no identical assets get republished.
# Published under a single rolling `integration`
# tag and marked as a pre-release, so GitHub never shows it as the "Latest"
# release (Latest = newest non-prerelease, non-draft). Testers always grab the
# same URL; assets are replaced each run, not accumulated.
#
# Assets are renamed to `Omniphony-Studio-integration-<os>-x86_64.<ext>`
# rather than the version-stamped names the packager emits, so they can't be
# mistaken for a stable release (consistent with mpv-omniphony's integration
# bundles). The Studio is the native (egui/wgpu) one: the Tauri Studio was
# removed before 0.7.0 (#677).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC

jobs:
  # Scheduled runs are skipped when `main` hasn't moved since the last
  # published integration build (the rolling `integration` tag is recreated at
  # the built commit on every publish, so tag SHA == HEAD means nothing new).
  # Manual dispatch always builds, so a rebuild can still be forced on demand
  # (e.g. after a toolchain or runner-image change).
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.cmp.outputs.should_build }}
    steps:
      - name: Compare integration tag with HEAD
        id: cmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: building unconditionally."
            exit 0
          fi
          # The tag is created by action-gh-release as a lightweight tag, so
          # object.sha is the commit itself (no annotated-tag dereference).
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/integration" \
            --jq .object.sha 2>/dev/null || true)
          if [ "$tag_sha" = "$GITHUB_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "integration tag already at $GITHUB_SHA — skipping rebuild."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "main moved (tag: ${tag_sha:-none}, HEAD: $GITHUB_SHA) — building."
          fi

  build-studio:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # ── Toolchains ────────────────────────────────────────────────────────

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Cache Cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        # Caching is an optimization, not a correctness step: a crash of the
        # cache action (e.g. the Node-20 entrypoint forced onto Node 24 dying on
        # the Windows runner) must never fail the build.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omniphony-renderer/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('omniphony-renderer/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── Platform dependencies ─────────────────────────────────────────────

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # PPA required: ubuntu-22.04 ships PipeWire 0.3.48 but pipewire-rs 0.9.x
          # needs >= 0.3.65. This PPA provides a compatible 0.3.85+ build.
          for attempt in 1 2 3; do
            if sudo add-apt-repository ppa:pipewire-debian/pipewire-upstream -y; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to add PipeWire PPA after $attempt attempts" >&2
              exit 1
            fi
            sleep 10
          done
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get update failed after $attempt attempts" >&2
              exit 1
            fi
            sleep 10
          done
          # What the renderer links (PipeWire, ALSA through cpal), as in
          # release.yml. The Studio links nothing that needs a -dev package.
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      # Required to compile cpal with ASIO on Windows. Licensing rationale and
      # the pinned SDK commit both live in the action.
      - name: Setup ASIO SDK (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-asio-sdk

      # ── Build (no publish — we rename + publish ourselves below) ──────────

      # The renderer and the engine library the installers ship, from this
      # commit.
      - name: Build the renderer and the engine library
        working-directory: omniphony-renderer
        run: |
          cargo build --release --locked
          cargo build --release --locked -p orender_ffi

      # The Studio's installers (#677), with the orender and engine library
      # built above. Its own build tree and toolchain (rust-toolchain.toml in
      # the crate).
      - name: Cache the native Studio build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: omniphony-studio-egui/target
          key: ${{ runner.os }}-studio-egui-${{ hashFiles('omniphony-studio-egui/Cargo.lock', 'omniphony-studio-egui/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-studio-egui-

      - name: Build the native Studio
        working-directory: omniphony-studio-egui
        run: cargo build --release --locked

      # The installers must start on a Windows without the Visual C++
      # Redistributable: see release.yml.
      - name: Check the binaries need no Visual C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/check_windows_crt_imports.py \
            omniphony-renderer/target/release/orender.exe \
            omniphony-renderer/target/release/orender.dll \
            omniphony-studio-egui/target/release/omniphony-studio-egui.exe

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build the native Studio installers
        shell: bash
        run: omniphony-studio-egui/scripts/package.sh

      # Rename to clear, version-less `integration` names so testers don't mistake
      # them for a stable release. Each platform emits a distinct set of extensions.
      - name: Stage renamed bundles
        shell: bash
        run: |
          set -e
          N=omniphony-studio-egui/target/packages
          mkdir -p staging
          shopt -s nullglob
          copy_one() { # <glob> <dest>
            local matches=( $1 )
            if [ ${#matches[@]} -gt 0 ]; then
              cp "${matches[0]}" "staging/$2"
              echo "staged $2  <-  ${matches[0]}"
            fi
          }
          copy_one "$N/*.deb"                "Omniphony-Studio-integration-linux-x86_64.deb"
          copy_one "$N/*.AppImage"           "Omniphony-Studio-integration-linux-x86_64.AppImage"
          copy_one "$N/*.msi"                "Omniphony-Studio-integration-windows-x86_64.msi"
          copy_one "$N/*-setup.exe"          "Omniphony-Studio-integration-windows-x86_64-setup.exe"
          ls -la staging/

      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-bundles-${{ runner.os }}
          path: staging/*

  publish-integration:
    needs: build-studio
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: studio-bundles-*
          merge-multiple: true
          path: dist

      # Reset the rolling release + tag so assets are replaced, not accumulated.
      - name: Delete previous integration release + tag (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete integration --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publish rolling integration pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: integration
          name: 'Omniphony Studio (integration build)'
          prerelease: true
          make_latest: false
          body: |
            Rolling integration build of Omniphony Studio from `main` — for testers,
            NOT a stable release. Rebuilt daily and on demand; assets here are
            replaced each run. File names carry `integration` rather than a version
            so they can't be confused with the official release.
          files: dist/*
