[package]
name = "orender_engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless decode→render engine for the orender spatial audio renderer (host-agnostic, no audio I/O)"
repository.workspace = true

[dependencies]
renderer.workspace = true
# Demonstration render backend: the starting point contributors copy. Only
# built and registered with the `example-backend` feature, so release builds
# don't ship (or offer in Studio) a backend nobody should render with.
example_backend = { workspace = true, optional = true }
# User-scriptable (Lua) render backend, registered at startup.
script_backend.workspace = true
omniphony_geometry.workspace = true
bridge_api.workspace = true
runtime_control.workspace = true
sys.workspace = true
live_log.workspace = true
# Audio output/input belong to the host_audio crate and reach the OSC server
# via runtime_control::HostControlHandler — never a dependency of this engine
# so liborender cross-compiles without cpal/pipewire/asio.
abi_stable.workspace = true
anyhow.workspace = true
log.workspace = true
rosc.workspace = true
# The wait-free queue the render path hands its OSC telemetry over (#670).
# Pure Rust, no system library: safe for the liborender cdylib.
rtrb = "0.4"
serde_json.workspace = true
# The OSC sockets' send buffer, which std cannot set (see osc::transport).
# Pure Rust over libc / windows-sys, no system library: safe for the
# liborender cdylib and its cross builds.
socket2.workspace = true
# Real-input FFT for the DirAC diffuse→height object generator (pure Rust, no
# system deps — safe for the liborender cdylib). Already in the workspace lock.
realfft.workspace = true

[features]
# Personalised HRTF loading (SOFA files) in the binaural stage.
sofa = ["renderer/sofa"]
# Register the demonstration backend (`backend_id = "example"`), for contributors
# trying the render-backend frontier end to end. Off in release builds.
example-backend = ["dep:example_backend"]

[dev-dependencies]
# Not linked by the tests: depending on it makes `cargo test` build its cdylib,
# the bridge the tests under tests/ load when no other one is given.
reference_bridge.workspace = true
