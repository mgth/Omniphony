[package]
name = "reference_bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reference decoder bridge: presents a multichannel WAV/PCM file as a channel bed for the orender spatial renderer (no proprietary decoder, no external player)"
repository.workspace = true

# cdylib: the loadable .so/.dll/.dylib bridge plugin.
# rlib: lets the unit tests and the demo generator example link the crate.
[lib]
name = "reference_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
bridge_api.workspace = true
abi_stable.workspace = true
log.workspace = true

# Deterministic multichannel WAV generator used to produce the committed demo
# asset (assets/demo/spatial-demo.wav). Self-contained: depends only on std.
[[example]]
name = "gen_demo_wav"
