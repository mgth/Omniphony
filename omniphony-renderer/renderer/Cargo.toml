[package]
name = "renderer"
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VBAP-based spatial audio renderer"

[lib]
name = "renderer"

[dependencies]
anyhow.workspace = true
omniphony_geometry.workspace = true
omniphony-osc-contract.workspace = true
bridge_api.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
arc-swap = "1"
libc.workspace = true
parking_lot.workspace = true
flate2 = "1.0"
realfft.workspace = true
rayon = "1"
sofar = { version = "0.3", optional = true }

[build-dependencies]
anyhow.workspace = true
bindgen = "0.70"

[dev-dependencies]
criterion = "0.5"
dsp_fixtures.workspace = true

[[bench]]
name = "render_frame"
harness = false

# Loads a room-response SOFA file through the BRIR loader and prints what it
# holds (`cargo run --release -p renderer --features sofa --example brir_probe
# -- <file> [all|front|raw M R E N]`).
[[example]]
name = "brir_probe"
required-features = ["sofa"]

[features]
# Worst-case block-time gate. Opt-in and run alone: a timing measurement must
# not share the machine with the rest of the suite running in parallel, or its
# high percentile picks up scheduler contention rather than renderer cost.
#   cargo test --release -p renderer --features perf-gate -- --test-threads=1
perf-gate = []
saf_vbap = []
# Enables loading external SOFA HRTF files for the binaural stage (adds a SOFA
# reader dependency). Off by default — the embedded SAF KEMAR set is always available.
sofa = ["dep:sofar"]
# Opt-in wide DSP validation matrix. Off by default so the PR gate stays
# inside its CI time budget; #[ignore] is reserved for tracked deferrals.
# Gates only `#[cfg(feature = "wide-matrix")]` test code in this crate — it
# forwards to nothing, so it cannot affect a release build.
wide-matrix = []
