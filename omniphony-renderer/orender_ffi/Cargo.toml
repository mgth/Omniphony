[package]
name = "orender_ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C ABI for the orender spatial audio renderer (produces liborender.so)"
repository.workspace = true

[lib]
# Produces liborender.so / orender.dll
name = "orender"
crate-type = ["cdylib"]

[dependencies]
orender_engine.workspace = true
# For build_fingerprint() (orender_build_id): the git-describe stamp lives in
# runtime_control, which both hosts already link — one source of truth.
runtime_control.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true

[dev-dependencies]
# The OrenderChannelLabel ↔ RChannelLabel discriminant-parity unit test.
bridge_api.workspace = true

[features]
# SOFA (personalised HRTF) support, on by default: liborender is the desktop
# artifact and the pure-Rust reader adds no system dependency. Embedded
# builds can use --no-default-features.
default = ["sofa"]
sofa = ["orender_engine/sofa"]
# The demonstration render backend (see orender_engine's feature).
example-backend = ["orender_engine/example-backend"]

[build-dependencies]
# 0.28 at least: 0.27 skips `#[unsafe(no_mangle)]` functions (edition 2024) and
# would emit a header without a single prototype.
cbindgen = "0.28"
