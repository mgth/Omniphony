language = "C"
pragma_once = true
include_guard = "ORENDER_H"
tab_width = 4
documentation = true
documentation_style = "c99"
# Usable from C++ too: `extern "C"` around the declarations, and the
# `#[repr(u8)]` label enum as `enum … : uint8_t` there (the plain-C form, an
# enum plus a same-named `typedef uint8_t`, is a redeclaration in C++).
cpp_compat = true

[parse]
parse_deps = false

[export]
prefix = ""
# The label enum is not referenced by any signature (labels cross as raw bytes),
# so cbindgen only emits it when listed explicitly.
include = ["OrenderChannelLabel"]

[enum]
# C has one flat namespace: emit OrenderChannelLabel_L, not a bare `L`/`C`.
prefix_with_name = true
