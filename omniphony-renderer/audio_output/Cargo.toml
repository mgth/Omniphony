[package]
name = "audio_output"
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Audio output backends (PipeWire, ASIO, CoreAudio)"

[lib]
name = "audio_output"

[dependencies]
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
rubato = "0.14"
rtrb = "0.4"
diag.workspace = true
serde.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire.workspace = true

# Windows: ASIO is always compiled in (no cargo feature gates it).
[target.'cfg(windows)'.dependencies]
cpal = { workspace = true, features = ["asio"] }

# macOS: cpal's default host is CoreAudio, so no extra feature is needed.
[target.'cfg(target_os = "macos")'.dependencies]
cpal.workspace = true
