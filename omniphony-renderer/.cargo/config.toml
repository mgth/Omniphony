# Windows (MSVC): link the C runtime statically, so `orender.exe` and
# `orender.dll` start on a Windows without the Visual C++ Redistributable
# (docs/installer.md, step 2). C and C++ compiled by build scripts through the
# `cc` crate (the ASIO SDK, the vendored Lua) follow it and build with /MT.
# Linux and macOS builds are not affected.
#
# Cargo reads this file when it runs from inside this directory (CI, the
# release workflows and the Tauri sidecar script all do), and a RUSTFLAGS or
# CARGO_ENCODED_RUSTFLAGS environment variable replaces it entirely: a build
# that sets one must add `-C target-feature=+crt-static` itself.
# scripts/check_windows_crt_imports.py (run by CI on the Windows builds)
# fails when a binary imports the runtime DLLs again.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
